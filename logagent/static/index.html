<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogIngestLLM</title>
<style>
:root{
  --mono:"Cascadia Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0a0d11;--bg2:#0e1217;--panel:#11161c;--panel2:#161c24;--line:#1f2731;--line2:#2a3542;
  --text:#d5dde6;--muted:#7b8898;--dim:#566270;--accent:#36c2dc;--accent2:#1e6f80;
  --crit:#ff4d5e;--high:#ff9f43;--med:#e9cc3f;--low:#6ea8fe;--noise:#5c6773;--ok:#3ddc84;--warn:#ffb547;
  --rowhover:#141b23;--sel:#132530;
}
[data-theme=light]{
  --bg:#eef1f4;--bg2:#e6eaee;--panel:#ffffff;--panel2:#f4f6f8;--line:#d9dfe5;--line2:#c7d0d9;
  --text:#18202a;--muted:#5a6776;--dim:#8592a0;--accent:#0b7f95;--accent2:#b9e2ea;
  --crit:#d2283a;--high:#c96a0c;--med:#9a7f00;--low:#2f6fde;--noise:#7b8794;--ok:#1d8a4e;--warn:#b86e00;
  --rowhover:#f1f5f8;--sel:#e3f2f5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:12.5px/1.45 var(--mono);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
/* ---------- top bar */
.bar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg2);min-height:34px;overflow-x:auto;white-space:nowrap}
.bar>div{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--line);color:var(--muted)}
.bar b{color:var(--text);font-weight:600}
.brand{color:var(--accent)!important;font-weight:700;letter-spacing:.08em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--noise);display:inline-block}
.dot.online{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.offline{background:var(--crit)}.dot.off{background:var(--noise)}
.bar .grow{flex:1;border-right:0}
.bar button{background:none;border:1px solid var(--line2);color:var(--muted);padding:2px 8px;cursor:pointer;border-radius:2px}
.bar button:hover{color:var(--text);border-color:var(--accent)}
/* ---------- layout */
.wrap{display:grid;grid-template-columns:272px 1fr;height:calc(100% - 35px)}
aside{border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto;min-width:0}
main{overflow-y:auto;min-width:0;padding:0 0 40px}
.sec{border-bottom:1px solid var(--line);padding:10px 12px}
.h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
.src{display:grid;grid-template-columns:16px 1fr;gap:6px;padding:3px 0;cursor:pointer;align-items:start}
.src input{margin:2px 0 0;accent-color:var(--accent)}
.src .t{color:var(--dim);font-size:11px;word-break:break-all}
.tag{display:inline-block;font-size:10px;padding:0 4px;border:1px solid var(--line2);color:var(--muted);border-radius:2px;margin-right:4px;text-transform:uppercase}
select,input[type=text],textarea{background:var(--panel);border:1px solid var(--line2);border-radius:2px;padding:5px 7px;width:100%}
select:focus,input:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.run{width:100%;margin-top:8px;background:var(--accent);color:#031015;border:0;padding:7px;font-weight:700;letter-spacing:.06em;cursor:pointer;border-radius:2px}
.open{width:100%;background:transparent;color:var(--accent);border:1px solid var(--accent);padding:9px;font-weight:700;letter-spacing:.06em;cursor:pointer;border-radius:2px}
.open:hover{background:rgba(54,194,220,.1)}
body.dropping::after{content:'drop log files or folders to analyze them';position:fixed;inset:12px;z-index:100;display:flex;align-items:center;justify-content:center;
  border:2px dashed var(--accent);border-radius:6px;background:rgba(5,10,14,.85);color:var(--accent);font:700 22px var(--mono);letter-spacing:.06em;pointer-events:none}
.run:disabled{background:var(--line2);color:var(--muted);cursor:default}
.chk{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent)}
pre.console{margin:8px 0 0;max-height:150px;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:6px;font-size:11px;color:var(--muted);white-space:pre-wrap}
.hist a{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 6px;border-left:2px solid transparent;color:var(--text);text-decoration:none}
.hist a:hover{background:var(--rowhover)}
.hist a.active{border-left-color:var(--accent);background:var(--sel)}
.hist .m{color:var(--dim);font-size:11px;grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- scan header */
.head{padding:14px 18px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.headline{font:600 15px/1.35 var(--sans);margin:0 0 4px}
.summary{font:13px/1.5 var(--sans);color:var(--muted);margin:0 0 10px;max-width:110ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--dim);font-size:11.5px}
.meta b{color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));border-bottom:1px solid var(--line)}
.kpi{padding:9px 14px;border-right:1px solid var(--line);background:var(--panel)}
.kpi .v{font-size:19px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kpi.crit .v{color:var(--crit)}.kpi.high .v{color:var(--high)}.kpi.med .v{color:var(--med)}.kpi.low .v{color:var(--low)}
.sevbar{display:flex;height:4px;background:var(--line)}
.sevbar span{display:block;height:100%}
.alert{padding:6px 18px;border-bottom:1px solid var(--line);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);font-size:11.5px}
/* ---------- tabs + toolbar */
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:2}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs .sp{flex:1}
.tools{display:flex;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tools input[type=text]{width:280px}
.tools select{width:auto}
.chip{border:1px solid var(--line2);background:none;color:var(--muted);padding:2px 8px;border-radius:2px;cursor:pointer;font-size:11px;text-transform:uppercase}
.chip.on{color:#031015;font-weight:700}
.chip.critical.on{background:var(--crit);border-color:var(--crit)}.chip.high.on{background:var(--high);border-color:var(--high)}
.chip.medium.on{background:var(--med);border-color:var(--med)}.chip.low.on{background:var(--low);border-color:var(--low)}
/* ---------- tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:33px;background:var(--bg2);z-index:1;text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap}
th.sorted{color:var(--accent)}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--rowhover)}
tr.r.open td{background:var(--sel)}
td.n{text-align:right;white-space:nowrap}
td.ts{white-space:nowrap;color:var(--muted)}
td.title{font-family:var(--sans);font-size:13px}
td.msg{color:var(--muted);word-break:break-word;font-size:11.5px}
.sev{display:inline-block;width:62px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 0;border-radius:2px;text-transform:uppercase}
.sev.critical{background:var(--crit);color:#fff}.sev.high{background:var(--high);color:#1a0d00}
.sev.medium{background:var(--med);color:#1a1600}.sev.low{background:transparent;color:var(--low);border:1px solid var(--low)}
.sev.noise{color:var(--noise);border:1px solid var(--noise)}
.new{color:var(--accent);font-size:10px;font-weight:700;margin-left:6px}
.lbl{font-size:10.5px;color:var(--dim)}
.lbl.useful{color:var(--ok)}.lbl.noise{color:var(--crit)}
/* ---------- detail */
.detail>td{padding:0;background:var(--panel)!important;cursor:default}
.dgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border-left:2px solid var(--accent)}
.dgrid>div{padding:12px 16px;min-width:0}
.dgrid>div+div{border-left:1px solid var(--line)}
.prose{font:13px/1.55 var(--sans)}
.prose dt{font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.prose dt:first-child{margin-top:0}
.prose dd{margin:2px 0 0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:11.5px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){word-break:break-all}
pre.sample{margin:6px 0 0;background:var(--bg);border:1px solid var(--line);padding:7px 8px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;color:var(--text)}
.fb{display:flex;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2);flex-wrap:wrap}
.fb .k{color:var(--dim);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
.fb button{background:none;border:1px solid var(--line2);color:var(--muted);padding:3px 9px;cursor:pointer;border-radius:2px;font-size:11.5px}
.fb button:hover{border-color:var(--accent);color:var(--text)}
.fb button.on.useful{background:var(--ok);border-color:var(--ok);color:#03140a}
.fb button.on.noise{background:var(--crit);border-color:var(--crit);color:#fff}
.fb select{width:auto;padding:2px 6px;font-size:11.5px}
.empty{padding:40px 18px;color:var(--dim);text-align:center}
.pad{padding:12px 18px}
.answer{white-space:pre-wrap;font:13px/1.55 var(--sans);margin-top:10px;max-width:110ch}
.btn{background:var(--accent);color:#031015;border:0;padding:6px 14px;font-weight:700;border-radius:2px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5}
td.title{min-width:200px}
/* ---------- learning + analyst tools */
.learn{grid-column:1/-1;border-top:1px solid var(--line);padding:12px 16px;border-left:2px solid var(--accent)}
.tok{border-bottom:1px dotted currentColor;cursor:help}
.tok.ip{color:var(--accent)}.tok.user{color:var(--high)}.tok.port{color:var(--low)}.tok.code{color:var(--med)}
.tok.pid{color:var(--muted)}.tok.path{color:var(--ok)}.tok.url{color:var(--crit)}.tok.time{color:var(--dim)}
table.anat td{padding:3px 8px}table.anat td:first-child{white-space:nowrap}
.cmd{margin:6px 0}.cmdrow{display:flex;gap:8px;align-items:flex-start;margin-top:2px}
.cmdrow code{flex:1;background:var(--bg);border:1px solid var(--line);padding:5px 8px;font-size:11.5px;white-space:pre-wrap;word-break:break-all}
.achip{display:inline-block;font-size:10px;padding:0 5px;margin:0 4px 2px 0;border:1px solid var(--accent2);color:var(--accent);border-radius:2px;text-decoration:none;font-weight:600}
.achip.ctx{border-style:dashed;color:var(--muted);font-weight:400}
.ichip{background:none;border:1px solid var(--line2);color:var(--text);padding:1px 6px;margin:0 4px 4px 0;border-radius:2px;cursor:pointer;font-size:11px}
.ichip:hover{border-color:var(--accent)}
.matrix{display:grid;grid-template-columns:repeat(12,minmax(128px,1fr));gap:4px;min-width:1560px}
.tac{background:var(--panel);border:1px solid var(--line);min-height:90px}
.tac.none{opacity:.45}
.tac .th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
.tcell{display:flex;flex-direction:column;gap:1px;width:calc(100% - 8px);margin:4px;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--low);color:var(--text);padding:4px 6px;cursor:pointer;font-size:11px}
.tcell.critical{border-left-color:var(--crit)}.tcell.high{border-left-color:var(--high)}.tcell.medium{border-left-color:var(--med)}.tcell.noise{border-left-color:var(--noise)}
.tcell:hover{border-color:var(--accent)}
.pivot{padding:3px 0;font-size:11.5px}
.patf{padding:6px 18px;border-bottom:1px solid var(--line);background:var(--sel);font-size:11.5px}
/* ---------- log viewer, tools, citations */
.logbox{border:1px solid var(--line2);background:var(--bg);font-size:12px}
.logline{display:grid;grid-template-columns:64px 1fr;border-left:3px solid transparent}
.logline .ln{color:var(--dim);text-align:right;padding:1px 10px 1px 0;user-select:none;border-right:1px solid var(--line)}
.logline .lt{padding:1px 10px;white-space:pre-wrap;word-break:break-all}
.logline.hit{background:var(--sel);border-left-color:var(--accent)}.logline.hit .lt{color:var(--text);font-weight:600}
.logline.dim{opacity:.35}
mark{background:var(--med);color:#111}
.logb{white-space:nowrap}
.smp{display:flex;gap:6px;align-items:flex-start}.smp pre{flex:1}.smp .logb{margin-top:6px}
.use{display:grid;grid-template-columns:auto auto auto 1fr;gap:10px;align-items:start;padding:3px 0;font-size:11.5px}
.use code{white-space:pre-wrap;word-break:break-all;color:var(--muted)}
.cite{background:var(--accent2);color:var(--text);border:0;border-radius:2px;padding:0 4px;margin:0 1px;font:600 10.5px var(--mono);cursor:pointer;vertical-align:1px}
.cite:hover{background:var(--accent);color:#031015}
.sugg{display:flex;flex-wrap:wrap;margin:4px 0 8px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:16px 18px}
.wcard{border:1px solid var(--line2);background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.wcard b{font:600 14px var(--sans)}.wcard .btn{align-self:flex-start;margin-top:auto}
.path{font:12px var(--mono);word-break:break-all}.path b{font-weight:600;color:var(--text)}.path span{color:var(--muted)}
.path.unusual b,.path.unusual{color:var(--high)}
.locrow{display:flex;gap:12px;align-items:baseline;padding:2px 0}
/* ---------- scan overview */
.ov{border-bottom:1px solid var(--line);background:var(--panel)}
.ovtop{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding:16px 18px 12px}
.verdict{font:700 11px var(--mono);letter-spacing:.1em;padding:6px 10px;border-radius:3px;white-space:nowrap;margin-top:2px}
.v-critical{background:var(--crit);color:#fff}.v-high{background:var(--high);color:#1a0d00}.v-medium{background:var(--med);color:#1a1600}.v-ok{background:var(--ok);color:#03140a}
.ovhead{font:600 17px/1.3 var(--sans)}
.ovctx{color:var(--muted);font-size:11.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 8px}
.dotsep{color:var(--dim)}
.ovact{display:flex;gap:6px;align-items:center}
.ovact a.mini{text-decoration:none;padding:2px 8px}
.warnb{color:var(--warn)!important;border-color:var(--warn)!important}
.ovgrid{display:grid;grid-template-columns:280px 1fr;border-top:1px solid var(--line)}
.ovleft{padding:12px 18px 14px;border-right:1px solid var(--line)}
.ovright{padding:12px 18px 14px;min-width:0}
.ovlbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:2px 0 6px}
.sbar{display:grid;grid-template-columns:62px 1fr 28px;gap:8px;align-items:center;font-size:11.5px;padding:2px 0;cursor:pointer}
.sbar:hover .sl{color:var(--text)}
.sbar .sl{color:var(--muted)}.sbar b{text-align:right;font-variant-numeric:tabular-nums}
.sbar .st{height:8px;background:var(--line);border-radius:2px;overflow:hidden}.sbar .sf{display:block;height:100%}
.sf.critical{background:var(--crit)}.sf.high{background:var(--high)}.sf.medium{background:var(--med)}.sf.low{background:var(--low)}
.ovstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2)}
.ovstats div{display:flex;flex-direction:column}.ovstats b{font-size:15px;font-variant-numeric:tabular-nums}.ovstats span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.ovwhat{font:14px/1.5 var(--sans);margin:0 0 10px;max-width:110ch}
.ovev,.ovsteps{margin:0 0 4px;padding-left:18px;font:13px/1.5 var(--sans)}
.ovev li,.ovsteps li{margin:3px 0}
.evt{font:11.5px var(--mono);color:var(--muted);margin-right:8px;white-space:nowrap}
.ovp{font:13px/1.5 var(--sans);color:var(--muted);margin:0 0 6px}
.ovpre{white-space:pre-wrap;font:13px/1.5 var(--sans);margin:0;max-height:260px;overflow:auto}
.ovdet{border-top:1px solid var(--line);padding:10px 18px 12px;background:var(--bg2)}
@media (max-width:900px){.ovgrid{grid-template-columns:1fr}.ovleft{border-right:0;border-bottom:1px solid var(--line)}.ovtop{grid-template-columns:1fr}}
/* ---------- label queue */
.qbar{height:4px;background:var(--line);margin-top:8px}.qbar span{display:block;height:100%;background:var(--ok)}
.qcard{border:1px solid var(--line2);background:var(--panel)}
.qtitle{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);font:600 15px var(--sans)}
.qact{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg2)}
.qbtn{background:none;border:1px solid var(--line2);color:var(--text);padding:5px 10px;border-radius:2px;cursor:pointer;font-size:12px;display:flex;gap:6px;align-items:center}
.qbtn:hover{border-color:var(--accent)}.qbtn:disabled{opacity:.4;cursor:default}
.qbtn.critical{border-color:var(--crit)}.qbtn.high{border-color:var(--high)}.qbtn.medium{border-color:var(--med)}.qbtn.low{border-color:var(--low)}
.qbtn.ok{border-color:var(--ok);color:var(--ok)}.qbtn.bad{border-color:var(--crit);color:var(--crit)}
kbd{font:10px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line)}
/* ---------- log locations */
.mini{background:none;border:1px solid var(--line2);color:var(--muted);padding:0 6px;cursor:pointer;border-radius:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.mini:hover{color:var(--text);border-color:var(--accent)}
.mini.on{color:var(--accent);border-color:var(--accent)}
.mini.danger:hover{color:var(--crit);border-color:var(--crit)}
td.act{white-space:nowrap;text-align:right}
td.act .mini{margin-left:4px}
.form{display:grid;grid-template-columns:120px minmax(0,560px);gap:6px 12px;align-items:center;padding:12px 18px}
.form label{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.form .hint{grid-column:2;color:var(--dim);font-size:11px;margin-top:-3px}
.form .row{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.sec{background:none;border:1px solid var(--line2);color:var(--muted)}
.result{font-size:11.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.result.ok{color:var(--ok)}.result.bad{color:var(--crit)}
.picker{border-left:2px solid var(--accent);background:var(--panel)}
.picker .tools{border-bottom:1px solid var(--line)}
.picker table th{top:0}
tr.dis td{color:var(--dim)}
.sumbox{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
.sumbox pre{margin:6px 0 0;white-space:pre-wrap;font:13px/1.55 var(--sans);max-width:120ch}
@media (max-width:1250px){.hide-sm{display:none}}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}.dgrid{grid-template-columns:1fr}.dgrid>div+div{border-left:0;border-top:1px solid var(--line)}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="brand">LOGINGESTLLM</div>
  <div>model <span class="dot" id="mDot"></span><b id="mName">…</b><span id="mDetail"></span></div>
  <div>privilege <b id="adm">…</b></div>
  <div>schedule <b id="sch">…</b></div>
  <div class="grow"></div>
  <div><button id="quitBtn" title="Stop the dashboard and the built-in model">QUIT</button><button id="mBtn" title="Your model's versions and scores">MODELS</button><button id="qBtn" title="Label patterns fast (keys: j k u n 1-4 z)">LABEL QUEUE</button><button id="refBtn" title="What common log events mean (Windows IDs, Linux messages, ATT&CK)">REFERENCE</button><button id="tz" title="Toggle UTC / local time">UTC</button><button id="theme" title="Toggle theme">◐</button></div>
</div>
<div class="wrap">
  <aside>
    <div class="sec">
      <button class="open" id="openBtn" title="Pick a log file on this computer (.evtx, .log, syslog, JSON…). It is copied into the app's own folder and scanned there; nothing leaves your machine.">OPEN LOG FILE…</button>
      <input type="file" id="fileIn" multiple hidden>
      <button class="open" id="folderBtn" style="margin-top:6px" title="Pick a whole folder, e.g. a copied C:\Windows\Prefetch or a folder of exported .evtx files. Log files in it (and its subfolders) are copied into the app's own folder and scanned together.">OPEN FOLDER…</button>
      <input type="file" id="folderIn" webkitdirectory multiple hidden>
      <div class="lbl" style="margin-top:6px">or drag log files or folders anywhere onto this window</div>
    </div>
    <div class="sec">
      <div class="h"><span>Sources <span id="srcCount"></span></span><button class="mini" id="locBtn" title="Add, edit, discover, and pick individual log files">log locations</button></div>
      <div id="sources"></div>
    </div>
    <div class="sec">
      <div class="h"><span>Window</span></div>
      <select id="window" aria-label="Time window">
        <option value="1h">1h</option><option value="6h">6h</option><option value="24h" selected>24h</option>
        <option value="3d">3d</option><option value="7d">7d</option><option value="30d">30d</option><option value="all">all</option>
      </select>
      <label class="chk"><input type="checkbox" id="useLlm" checked> model review</label>
      <label class="chk" title="Also write a summary of everything collected, aware of the OS it came from"><input type="checkbox" id="summarize"> summarize whole log</label>

      <div class="h"><span>History</span><span id="histCount"></span></div>
      <div id="history"><div class="empty">no scans</div></div>
    </div>
  </aside>
  <main id="main"><div class="empty">loading…</div></main>
</div>
<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'on') for (const [e, f] of Object.entries(v)) n.addEventListener(e, f);
    else if (k === 'checked' || k === 'selected' || k === 'disabled') n[k] = !!v;
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
};
const api = async (path, body) => {
  try {
    const r = await fetch(path, body ? {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)} : {});
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
    return j;
  } catch (e) { return {error: 'dashboard server unreachable'}; }
};
const store = {get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};

// ---------- time formatting (precise, sortable)
let utc = store.get('tz', 'utc') === 'utc';
const pad = n => String(n).padStart(2, '0');
function ts(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso || '—';
  if (utc) return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}Z`;
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function rate(f) {
  if (f.count < 2) return '—';
  const span = (new Date(f.last) - new Date(f.first)) / 1000;
  if (span <= 0) return `${f.count}/<1s`;
  const ph = f.count / span * 3600;
  return ph >= 60 ? `${(ph / 60).toFixed(1)}/min` : ph >= 1 ? `${ph.toFixed(1)}/h` : `${(ph * 24).toFixed(1)}/d`;
}
function span(f) {
  const s = (new Date(f.last) - new Date(f.first)) / 1000;
  if (!(s > 0)) return '0s';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = Math.floor(s % 60);
  return [d && d + 'd', h && h + 'h', m && m + 'm', !d && x && x + 's'].filter(Boolean).join(' ');
}
const LV = ['critical', 'high', 'medium', 'low', 'noise'];
const impOf = s => s >= 100 ? 'critical' : s >= 75 ? 'high' : s >= 50 ? 'medium' : 'low';

// ---------- state
let current = null, fb = {}, tab = store.get('tab', 'findings'), openKey = null;
let sys = {}, view = 'scan', locTab = 'configured', srcs = [], cfgPath = null;
let q = '', hostF = '', levels = new Set(LV.slice(0, 4)), sortBy = {k: 'imp', d: 1}, showAll = false;

async function init() {
  document.documentElement.dataset.theme = store.get('theme', 'dark');
  $('#tz').textContent = utc ? 'UTC' : 'LOCAL';
  sys = await api('/api/system');
  if (sys.error) sys = {};
  api('/api/queue').then(r => { if (!r.error) { Q = Q || r; $('#qBtn').textContent = `LABEL QUEUE ${r.unlabeled}`; } });
  api('/api/reference').then(r => { if (!r.error) { refCat = r; if (current || view !== 'scan') render(); } });
  const cfg = await api('/api/config');
  if (cfg.error) { $('#main').replaceChildren(el('div', {class: 'empty'}, cfg.error)); return; }
  if (cfg.window) $('#window').value = cfg.window;
  renderSourceList(cfg);
  const full = await api('/api/sources'); srcs = full.sources || []; cfgPath = full.config_path;
  await status();
  setInterval(status, 15000);
  await loadHistory(true);
  pollJob();
}

function renderSourceList(cfg) {
  const box = $('#sources'); box.replaceChildren();
  if (!cfg.sources.length) box.append(el('div', {class: 'lbl'}, 'no sources yet: open ', el('a', {href: '#', on: {click: e => { e.preventDefault(); openLocations(); }}}, 'log locations')));
  for (const s of cfg.sources) box.append(el('label', {class: 'src'},
    el('input', {type: 'checkbox', value: s.name, checked: s.enabled}),
    el('span', {}, el('span', {class: 'tag'}, s.type), s.name, el('div', {class: 't'}, s.detail || ''))));
  $('#srcCount').textContent = cfg.sources.length ? `[${cfg.sources.length}]` : '';
}

async function refreshSources() {
  const cfg = await api('/api/config');
  if (!cfg.error) renderSourceList(cfg);
  const full = await api('/api/sources');
  if (!full.error) { srcs = full.sources || []; cfgPath = full.config_path; }
}

async function status() {
  const s = await api('/api/status');
  if (s.error) { $('#mDot').className = 'dot offline'; $('#mName').textContent = 'dashboard offline'; return; }
  const m = s.model || {};
  $('#mDot').className = 'dot ' + m.state;
  $('#mName').textContent = s.llm.provider === 'none' ? 'disabled' : `${s.llm.model || s.llm.provider}`;
  const where = s.llm.provider === 'bundled' ? ' built-in' : m.latency_ms != null ? ` ${m.latency_ms}ms` : '';
  $('#mDetail').textContent = m.state === 'online' ? where + (s.llm.mode ? ` · ${s.llm.mode}` : '') :
    m.state === 'starting' ? ' loading…' : m.state === 'offline' ? ' OFFLINE → rules only' : '';
  $('#mDetail').title = m.detail || '';
  $('#adm').textContent = s.admin ? (sys.os === 'Windows' ? 'admin' : 'root') : sys.os === 'Windows' ? 'user (Security log skipped)' : sys.journal_system === false ? 'user (system journal not readable)' : 'user';
  $('#adm').style.color = s.admin || sys.os !== 'Windows' && sys.journal_system !== false ? 'var(--ok)' : 'var(--warn)';
  $('#sch').textContent = s.schedule?.every ? `every ${s.schedule.every} · next ${s.schedule.next ? ts(s.schedule.next) : '—'}` : 'manual';
  if (s.llm.provider === 'none' || m.state === 'offline') $('#useLlm').checked = false;
}

const histItem = s => el('a', {href: '#' + s.id, class: view === 'scan' && current?.id === s.id ? 'active' : '',
  on: {click: e => { e.preventDefault(); openScan(s.id); }}},
  el('span', {}, ts(s.created)), el('span', {class: 'lbl'}, `${s.flagged}⚑ ${s.events}ev`),
  el('span', {class: 'm'}, (s.label ? '⎘ ' + s.label + ' · ' : '') + (s.headline || '')));

async function loadHistory(openLatest) {
  const scans = await api('/api/scans');
  const h = $('#history'); h.replaceChildren();
  $('#histCount').textContent = scans.length || '';
  if (!scans.length) h.append(el('div', {class: 'empty'}, 'no scans'));
  for (const s of scans) h.append(histItem(s));
  if (location.hash === '#locations') { if (view !== 'locations') openLocations(); return; }
  if (location.hash === '#reference') { view = 'reference'; renderReference(); return; }
  if (location.hash === '#queue') { if (view !== 'queue') openQueue(); return; }
  if (location.hash === '#models') { if (view !== 'models') openModels(); return; }
  if (!scans.length) { if (view === 'scan' && !current) render(); return; }
  const want = location.hash.slice(1) || (openLatest && scans[0].id);
  if (want && (!current || current.id !== want)) await openScan(want);
}

async function openScan(id) {
  const s = await api('/api/scans/' + encodeURIComponent(id));
  if (s.error) return;
  fb = await api('/api/feedback/' + encodeURIComponent(id));
  if (fb.error) fb = {};
  current = s; openKey = null; view = 'scan'; showAll = !!s.label; patF = null; expl = {}; pivots = {}; ovMore = false; ovDetails = false;
  if (pendingOpenKey) { const k = pendingOpenKey; pendingOpenKey = null; showAll = true; tab = 'findings';
    const hit = rows().find(r => r.keys.includes(k)); if (hit) { openKey = hit.keys.join(','); setTimeout(scrollOpenRow, 0); } }
  if (pendingPivot) { const i = (s.iocs || []).find(x => x.type === pendingPivot.type && x.value === pendingPivot.value);
    if (i) { patF = {label: `${i.type} ${i.value}`, keys: new Set(i.keys)}; showAll = true; tab = 'findings'; } pendingPivot = null; }
  history.replaceState(null, '', '#' + id);
  document.querySelectorAll('.hist a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
  render();
}

// Merge the model/rules verdicts with the raw cluster metadata, one row per finding.
function rows() {
  const s = current, a = s.analysis || {};
  const byKey = Object.fromEntries([...(s.findings || []), ...(s.others || [])].map(f => [f.key, f]));
  const out = [];
  const used = new Set();
  for (const f of a.findings || []) {
    const raws = (f.keys || []).map(k => byKey[k]).filter(Boolean);
    if (!raws.length) continue;
    raws.forEach(r => used.add(r.key));
    const p = raws[0];
    out.push({imp: (f.importance || 'low').toLowerCase(), title: f.title, why: f.why, action: f.action, what: f.what, related: f.related,
      host: f.host || p.host, source: p.source, program: p.program, event_id: p.event_id, raws, keys: raws.map(r => r.key),
      count: raws.reduce((n, r) => n + r.count, 0), first: raws.map(r => r.first).sort()[0], last: raws.map(r => r.last).sort().at(-1),
      score: Math.max(...raws.map(r => r.score)), novel: raws.some(r => r.novel)});
  }
  for (const d of a.dismissed || []) {
    for (const k of d.keys || []) { const p = byKey[k]; if (!p || used.has(k)) continue; used.add(k);
      out.push({imp: 'noise', title: p.rule?.title || p.template.slice(0, 90), why: d.reason, action: '', host: p.host, source: p.source,
        program: p.program, event_id: p.event_id, raws: [p], keys: [k], count: p.count, first: p.first, last: p.last, score: p.score, novel: p.novel}); }
  }
  if (showAll) for (const p of [...(s.findings || []), ...(s.others || [])]) {
    if (used.has(p.key)) continue;
    out.push({imp: p.score >= 30 ? impOf(p.score) : 'noise', title: p.rule?.title || p.template.slice(0, 90), why: p.rule?.why || '', action: p.rule?.action || '',
      host: p.host, source: p.source, program: p.program, event_id: p.event_id, raws: [p], keys: [p.key], count: p.count,
      first: p.first, last: p.last, score: p.score, novel: p.novel, unreviewed: true});
  }
  return out;
}

function render() {
  if (view === 'locations') return renderLocations();
  if (view === 'reference') return renderReference();
  if (view === 'queue') return renderQueue();
  if (view === 'log') return renderLog();
  if (view === 'models') return renderModels();
  if (!current) return renderWelcome();
  const s = current, a = s.analysis || {}, st = s.stats || {}, meta = a._meta || {};
  const m = $('#main'); m.replaceChildren();
  const all = rows();

  renderOverview(m);

  const tabs = el('div', {class: 'tabs'});
  const nTech = new Set([...(s.findings || []), ...(s.others || [])].flatMap(c => c.attack || [])).size;
  for (const [k, t] of [['findings', `Findings [${all.length}]`], ['timeline', 'Timeline'], ['tools', `Tools [${(s.tools || []).length}]`], ['attack', `ATT&CK [${nTech}]`], ['iocs', `Indicators [${(s.iocs || []).length}]`],
                        ['sources', 'Sources'], ['query', 'Query model']])
    tabs.append(el('button', {class: tab === k ? 'on' : '', on: {click: () => { tab = k; store.set('tab', k); render(); }}}, t));
  m.append(tabs);

  if (tab === 'findings') renderFindings(m, all);
  else if (tab === 'attack') renderAttack(m);
  else if (tab === 'tools') renderTools(m);
  else if (tab === 'timeline') renderTimeline(m);
  else if (tab === 'iocs') renderIocs(m);
  else if (tab === 'sources') renderSources(m);
  else renderQuery(m);
}
const kpi = (v, l, c) => el('div', {class: 'kpi ' + (c || '')}, el('div', {class: 'v'}, v ?? 0), el('div', {class: 'l'}, l));

function renderFindings(m, all) {
  const hosts = [...new Set(all.map(r => r.host))].sort();
  const search = el('input', {type: 'text', placeholder: 'grep: host, program, event id, text…', value: q,
    on: {input: e => { q = e.target.value; const pos = e.target.selectionStart; render(); const i = document.querySelector('.tools input[type=text]'); i.focus(); i.setSelectionRange(pos, pos); }}});
  m.append(el('div', {class: 'tools'}, search,
    el('select', {'aria-label': 'Host', on: {change: e => { hostF = e.target.value; render(); }}},
      el('option', {value: ''}, 'all hosts'), ...hosts.map(h => el('option', {value: h, selected: h === hostF}, h))),
    ...LV.map(l => el('button', {class: `chip ${l} ${levels.has(l) ? 'on' : ''}`, on: {click: () => { levels.has(l) ? levels.delete(l) : levels.add(l); render(); }}}, l)),
    el('label', {class: 'chk', style: 'margin:0'}, el('input', {type: 'checkbox', checked: showAll, on: {change: e => { showAll = e.target.checked; render(); }}}),
      `+ unreviewed patterns (${(current.others || []).length + (current.findings || []).length})`)));

  const ql = q.toLowerCase();
  if (patF) m.append(el('div', {class: 'patf'}, `showing only patterns with ${patF.label} `,
    el('button', {class: 'mini', on: {click: () => { patF = null; render(); }}}, 'clear filter')));
  let list = all.filter(r => (!patF || r.keys.some(k => patF.keys.has(k))) && (patF || levels.has(r.imp)) && (!hostF || r.host === hostF) &&
    (!ql || [r.title, r.host, r.source, r.program, r.event_id, r.why, ...r.raws.flatMap(x => x.samples)].join(' ').toLowerCase().includes(ql)));
  const key = {imp: r => LV.indexOf(r.imp) * 1000 - r.score, title: r => r.title, host: r => r.host, source: r => r.source + r.program,
    event_id: r => r.event_id, count: r => -r.count, rate: r => -(r.count / Math.max(1, new Date(r.last) - new Date(r.first))),
    first: r => r.first, last: r => r.last, score: r => -r.score}[sortBy.k];
  list.sort((x, y) => { const a = key(x), b = key(y); return (a < b ? -1 : a > b ? 1 : 0) * sortBy.d; });

  shownRows = list;
  if (helpOn) m.append(keysHelp());
  if (!list.length) { m.append(el('div', {class: 'empty'}, all.length ? 'no rows match the filter' : 'nothing flagged in this window')); return; }
  const cols = [['imp', 'sev'], ['title', 'finding'], ['host', 'host'], ['source', 'source / program'], ['event_id', 'id'],
    ['count', 'n'], ['rate', 'rate'], ['first', 'first'], ['last', 'last'], ['score', 'score'], [null, 'label']];
  const t = el('table', {}, el('tr', {}, ...cols.map(([k, l]) => el('th', {class: (sortBy.k === k ? 'sorted' : '') + (['first', 'rate'].includes(k) ? ' hide-sm' : ''),
    on: {click: () => { if (!k) return; sortBy = sortBy.k === k ? {k, d: -sortBy.d} : {k, d: 1}; render(); }}},
    l, sortBy.k === k ? (sortBy.d > 0 ? ' ▾' : ' ▴') : ''))));
  for (const r of list) {
    const id = r.keys.join(','), open = openKey === id, lab = fb[r.keys[0]];
    t.append(el('tr', {class: 'r' + (open ? ' open' : ''), on: {click: () => { openKey = open ? null : id; render(); }}},
      el('td', {}, el('span', {class: 'sev ' + r.imp}, r.imp)),
      el('td', {class: 'title'}, r.title, r.novel ? el('span', {class: 'new', title: 'first time this pattern appeared on this host'}, 'NEW') : null,
        r.unreviewed ? el('span', {class: 'lbl', style: 'margin-left:6px'}, '(unreviewed)') : null,
        attackOf(r).length ? el('div', {}, ...attackOf(r).map(t => attackChip(t))) : null),
      el('td', {}, r.host), el('td', {class: 'msg'}, `${r.source} / ${r.program || '—'}`), el('td', {title: r.source?.startsWith('windows') && winRef(r.event_id) ? `${r.event_id}: ${winRef(r.event_id).title}\n${winRef(r.event_id).meaning}` : ''}, r.event_id || '—'),
      el('td', {class: 'n'}, r.count), el('td', {class: 'n hide-sm'}, rate(r)),
      el('td', {class: 'ts hide-sm'}, ts(r.first)), el('td', {class: 'ts'}, ts(r.last)), el('td', {class: 'n'}, r.score.toFixed(1)),
      el('td', {}, lab ? el('span', {class: 'lbl ' + lab.verdict}, lab.verdict === 'noise' ? 'noise' : '✓ ' + (lab.importance || '')) : el('span', {class: 'lbl'}, '—'))));
    if (open) t.append(el('tr', {class: 'detail'}, el('td', {colspan: cols.length}, detail(r))));
  }
  m.append(t);
}

function detail(r) {
  const p = r.raws[0];
  const kv = (pairs) => el('div', {class: 'kv'}, ...pairs.filter(([, v]) => v !== '' && v != null).flatMap(([k, v]) => [el('span', {}, k), el('span', {}, String(v))]));
  const tech = attackOf(r), found = iocsFor(r.keys);
  return el('div', {class: 'dgrid'},
    el('div', {},
      el('dl', {class: 'prose'},
        r.why ? [el('dt', {}, 'assessment'), el('dd', {}, r.why)] : null,
        r.action ? [el('dt', {}, 'action'), el('dd', {}, r.action)] : null,
        r.related ? [el('dt', {}, 'correlation'), el('dd', {}, r.related)] : null,
        tech.length ? [el('dt', {}, 'MITRE ATT&CK'), el('dd', {}, ...tech.map(t => el('div', {}, attackChip(t), techName(t))))] : null,
        found.length ? [el('dt', {}, `indicators (${found.length}) · click to find every pattern with one`), el('dd', {}, ...found.slice(0, 24).map(iocChip))] : null,
        toolsForKeys(r.keys).length ? [el('dt', {}, 'tools seen in this pattern'), el('dd', {}, ...toolsForKeys(r.keys).map(({t, i}) =>
          el('button', {class: 'ichip', title: t.what, on: {click: e => { e.stopPropagation(); const j = t.uses.findIndex(u => r.keys.includes(u.key) && u.loc);
            if (j >= 0) openLog(current.id, `t/${i}/${j}`); else { tab = 'tools'; toolsOpen[i] = true; render(); } }}},
            el('span', {class: 'lbl'}, (CAT_LABEL[t.category] || t.category) + ' '), t.name)))] : null),
      fbControls(r)),
    el('div', {},
      el('div', {style: 'display:flex;gap:6px;margin-bottom:8px'},
        p.first_loc ? logBtn(current.id, `c/${p.key}/-1`, '↗ first occurrence in log') : null,
        p.last_loc ? logBtn(current.id, `c/${p.key}/-2`, '↗ latest in log') : null),
      kv([['occurrences', r.count], ['first seen', ts(r.first)], ['last seen', ts(r.last)], ['span', span(r)], ['rate', rate(r)],
          ['host', r.host], ['source', p.source], ['program', p.program], ['event id', p.event_id], ['max severity', p.severity],
          ['pre-score', r.score.toFixed(1) + (p.reasons?.length ? '  (' + p.reasons.join('; ') + ')' : '')],
          ['rule', p.rule ? `${p.rule.id}  [${p.rule.category}]` : 'none'], ['new on host', r.novel ? 'yes' : 'no'],
          ['cluster', r.keys.join(', ')], ...Object.entries(p.fields || {}).slice(0, 16).map(([k, v]) => ['· ' + k, v])]),
      el('div', {class: 'h', style: 'margin-top:12px'}, el('span', {}, 'template')),
      el('pre', {class: 'sample'}, p.template),
      el('div', {class: 'h', style: 'margin-top:12px'}, el('span', {}, `samples (${r.raws.reduce((n, x) => n + x.samples.length, 0)} distinct, newest first)`)),
      ...r.raws.flatMap(x => x.samples.map((sm, i) => el('div', {class: 'smp'}, el('pre', {class: 'sample'}, sm),
        (x.sample_locs || [])[i] ? logBtn(current.id, `c/${x.key}/${i}`) : null)))),
    learnBox(r));
}

function fbControls(r) {
  const cur = fb[r.keys[0]] || {};
  const imp = el('select', {'aria-label': 'importance', on: {change: () => send('useful', imp.value)}},
    ...LV.slice(0, 4).map(o => el('option', {value: o, selected: (cur.importance || (r.imp === 'noise' ? 'medium' : r.imp)) === o}, o)));
  const send = async (verdict, importance) => {
    const clear = cur.verdict === verdict && importance === undefined;
    await labelKeys(current.id, r.keys, clear ? null : verdict, clear || verdict !== 'useful' ? null : (importance || imp.value));
    render();

async function findingsKey(e) {

  const move = d => { i = Math.max(0, Math.min(rowsNow.length - 1, (i < 0 ? (d > 0 ? -1 : 0) : i) + d)); openKey = rowsNow[i].keys.join(','); render(); scrollOpenRow(); };

        el('button', {class: 'mini danger', on: {click: () => {
          if (confirmDel !== i) { confirmDel = i; renderLocations(); return; }
          confirmDel = null; testRes = {}; editIdx = null; picker = null; saveSources(srcs.filter((_, j) => j !== i));
        }}}, confirmDel === i ? 'confirm remove' : 'remove'))));
    if (editIdx === i) t.append(el('tr', {class: 'detail'}, el('td', {colspan: cols}, sourceForm(form, async f => {
      if (await saveSources(srcs.map((x, j) => j === i ? f : x))) editIdx = null; renderLocations(); }, () => { editIdx = null; renderLocations(); }))));
    if (picker?.key === 'src' + i) t.append(el('tr', {class: 'detail'}, el('td', {colspan: cols}, pickerView())));
  });
  m.append(t);
}

function testLine(r) {
  if (r.pending) return 'testing…';
  if (!r.ok) return 'failed: ' + (r.error || 'unknown') + (r.files != null ? ` (${r.files} files)` : '');
  return `${r.events} events in ${r.window}` + (r.files != null ? ` · ${r.files} files${r.unreadable ? `, ${r.unreadable} no access` : ''}` : '') +
    (r.last ? ` · last ${ts(r.last)}` : '') + (r.warnings?.length ? ` · ${r.warnings.length} warning(s)` : '');
}

async function runTest(i, s) {
  testRes[i] = {pending: true}; renderLocations();
  testRes[i] = await api('/api/sources/test', {source: s});
  if (testRes[i].error && !('ok' in testRes[i])) testRes[i] = {ok: false, error: testRes[i].error};
  renderLocations();
}

function sourceForm(f, onSave, onCancel) {
  const types = [...new Set([...(sys.types || []), f.type].filter(Boolean))];
  const res = el('div', {class: 'result'});
  const bind = (k, attrs = {}) => el('input', {type: 'text', value: Array.isArray(f[k]) ? f[k].join(', ') : (f[k] ?? ''), ...attrs,
    on: {input: e => { f[k] = e.target.value; }}});
  const fields = [el('label', {}, 'name'), bind('name', {placeholder: 'e.g. nginx, var log, myapp'}),
    el('label', {}, 'type'), el('select', {on: {change: e => { f.type = e.target.value; renderLocations(); }}},
      ...types.map(t => el('option', {value: t, selected: t === f.type}, t + ((sys.types || []).includes(t) ? '' : ' (not on this os)')))),
    el('div', {class: 'hint'}, TYPE_INFO[f.type] || '')];
  if (['files', 'syslog', 'app', 'evtx'].includes(f.type)) fields.push(el('label', {}, 'path'), bind('path', {placeholder: PATH_HINT[sys.os] || '/path/to/logs'}),
    el('div', {class: 'hint'}, 'a folder (reads log files up to two levels down), a glob, or one file; ~ and env vars work'));
  if (['files', 'syslog', 'app'].includes(f.type)) fields.push(el('label', {}, 'host'), bind('host', {placeholder: 'optional: the machine these logs came from (default: this one)'}));
  if (f.type === 'files') fields.push(el('label', {}, 'format'), el('select', {on: {change: e => { f.format = e.target.value; }}},
    ...['auto', 'syslog', 'journal', 'app', 'evtx'].map(o => el('option', {value: o, selected: (f.format || 'auto') === o}, o))));
  if (f.type === 'app') fields.push(el('label', {}, 'app name'), bind('app', {placeholder: 'optional, defaults to the file name'}));
  if (f.type === 'windows') fields.push(el('label', {}, 'channels'), bind('channels', {placeholder: 'System, Application, Security'}));
  if (f.type === 'journald') fields.push(el('label', {}, 'units'), bind('units', {placeholder: 'optional: nginx.service, sshd.service (empty = whole journal)'}));
  fields.push(el('label', {}, 'enabled'), el('label', {class: 'chk', style: 'margin:0'}, el('input', {type: 'checkbox', checked: f.enabled !== false,
    on: {change: e => { f.enabled = e.target.checked; }}}), 'include in RUN SCAN and scheduled scans'));
  fields.push(el('span', {}), el('div', {class: 'row'},
    el('button', {class: 'btn', on: {click: () => { const c = {...f}; if (c.enabled !== false) delete c.enabled; onSave(c); }}}, 'SAVE'),
    el('button', {class: 'btn sec', on: {click: async () => { res.className = 'result'; res.textContent = 'testing…';
      const r = await api('/api/sources/test', {source: f}); const ok = r.ok;
      res.className = 'result ' + (ok ? 'ok' : 'bad'); res.textContent = ok ? testLine(r) + (r.sample ? '\nnewest: ' + r.sample : '') : 'failed: ' + r.error; }}}, 'TEST'),
    el('button', {class: 'btn sec', on: {click: onCancel}}, 'CANCEL')), el('span', {}), res);
  return el('div', {class: 'form', on: {click: e => e.stopPropagation()}}, ...fields);
}

async function togglePicker(key, spec) {
  if (picker?.key === key) { picker = null; renderLocations(); return; }
  editIdx = null;
  picker = {key, spec, data: null, filter: '', picked: new Set(), msg: ''};
  renderLocations();
  const d = await api('/api/browse', {source: spec});
  if (picker?.key !== key) return;
  picker.data = d.error ? {kind: 'error', items: [], hint: d.error} : d;
  if (picker.data.kind === 'files') { // preselect the newest readable file
    const first = picker.data.items.find(x => x.readable && x.bytes > 0 && x.format !== 'binary');
    if (first) picker.picked.add(first.path);
  }
  renderLocations();
}

function pickerView() {
  const p = picker, d = p.data;
  if (!d) return el('div', {class: 'pad picker'}, 'reading location…');
  const win = el('select', {'aria-label': 'window', style: 'width:auto'}, ...['all', '30d', '7d', '24h', '6h', '1h'].map(w => el('option', {value: w}, w === 'all' ? 'whole file (all time)' : 'last ' + w)));
  if (d.kind === 'units' || d.kind === 'channels' || d.kind === 'whole') win.value = $('#window').value;
  const useLlm = el('input', {type: 'checkbox', checked: $('#useLlm').checked});
  const sum = el('input', {type: 'checkbox', checked: true});
  const count = el('span', {class: 'lbl'});
  const go = el('button', {class: 'btn', style: 'margin:0'});
  const msg = el('div', {class: 'result', style: 'padding:0 18px 8px'}, p.msg || '');
  const body = el('tbody');
  const itemKey = x => x.path || x.unit || x.channel;
  const update = () => {
    const n = p.picked.size;
    count.textContent = d.kind === 'whole' ? '' : `${n} selected of ${d.items.length}`;
    go.textContent = d.kind === 'files' ? `ANALYZE ${n || ''} FILE${n === 1 ? '' : 'S'}` : d.kind === 'units' ? (n ? `ANALYZE ${n} UNIT${n === 1 ? '' : 'S'}` : 'ANALYZE ENTIRE JOURNAL') :
      d.kind === 'channels' ? `ANALYZE ${n} CHANNEL${n === 1 ? '' : 'S'}` : 'ANALYZE';
    go.disabled = (d.kind === 'files' || d.kind === 'channels') && !n || d.kind === 'error';
  };
  const drawRows = () => {
    body.replaceChildren();
    const fl = p.filter.toLowerCase();
    const items = d.items.filter(x => !fl || itemKey(x).toLowerCase().includes(fl));
    for (const x of items.slice(0, 400)) {
      const k = itemKey(x), ok = d.kind !== 'files' || (x.readable && x.format !== 'binary');
      const cb = el('input', {type: 'checkbox', checked: p.picked.has(k), disabled: !ok,
        on: {change: e => { e.target.checked ? p.picked.add(k) : p.picked.delete(k); update(); }}});
      const cells = d.kind === 'files'
        ? [el('td', {class: 'msg', style: 'color:var(--text)'}, x.name), el('td', {}, el('span', {class: 'tag'}, x.format)),
           el('td', {class: 'n'}, fmtBytes(x.bytes)), el('td', {class: 'ts'}, ts(x.mtime)),
           el('td', {class: 'lbl', style: ok ? '' : 'color:var(--warn)'}, !x.readable ? 'no access' : x.format === 'binary' ? 'binary' : 'ok')]
        : [el('td', {class: 'msg', style: 'color:var(--text)'}, k)];
      body.append(el('tr', {class: 'r' + (ok ? '' : ' dis'), on: {click: e => { if (e.target !== cb && ok) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); } }}},
        el('td', {style: 'width:24px'}, cb), ...cells));
    }
    if (items.length > 400) body.append(el('tr', {}, el('td', {colspan: 6, class: 'lbl'}, `${items.length - 400} more; narrow the filter`)));
  };
  go.addEventListener('click', async () => {
    const r = await analyzePicked(p.spec, d.kind, [...p.picked], win.value, useLlm.checked, sum.checked);
    if (r.error) { p.msg = '⚠ ' + r.error; msg.textContent = p.msg; msg.className = 'result bad'; }
  });
  const wrap = el('div', {class: 'picker', on: {click: e => e.stopPropagation()}});
  if (d.hint) wrap.append(el('div', {class: 'alert'}, 'ⓘ ' + d.hint));
  const tools = el('div', {class: 'tools'});
  if (d.kind !== 'whole' && d.kind !== 'error') tools.append(
    el('input', {type: 'text', placeholder: 'filter', value: p.filter, style: 'width:200px', on: {input: e => { p.filter = e.target.value; drawRows(); }}}),
    el('button', {class: 'mini', on: {click: () => { const fl = p.filter.toLowerCase();
      for (const x of d.items) if ((d.kind !== 'files' || (x.readable && x.format !== 'binary')) && (!fl || itemKey(x).toLowerCase().includes(fl))) p.picked.add(itemKey(x));
      drawRows(); update(); }}}, 'select all'),
    el('button', {class: 'mini', on: {click: () => { p.picked.clear(); drawRows(); update(); }}}, 'none'), count);
  tools.append(el('span', {style: 'flex:1'}), win,
    el('label', {class: 'chk', style: 'margin:0'}, useLlm, 'model review'),
    el('label', {class: 'chk', style: 'margin:0', title: 'model writes an OS-aware summary of everything picked'}, sum, 'summarize'), go);
  wrap.append(tools, msg);
  if (d.kind === 'files' || d.kind === 'units' || d.kind === 'channels') {
    const head = d.kind === 'files' ? ['', 'file', 'format', 'size', 'modified', 'access'] : ['', d.kind === 'units' ? 'systemd unit' : 'channel'];
    wrap.append(el('table', {}, el('thead', {}, el('tr', {}, ...head.map(h => el('th', {}, h)))), body));
    if (!d.items.length) wrap.append(el('div', {class: 'empty'}, d.kind === 'files' ? 'no log files at this location' : 'nothing listed'));
  }
  drawRows(); update();
  return wrap;
}

async function analyzePicked(spec, kind, picks, window, useLlm, summarize) {
  let specs, label;
  if (kind === 'files') {
    const taken = [];
    specs = picks.map(path => {
      const name = uniqueName(baseName(path), taken); taken.push(name);
      const t = ['syslog', 'app', 'evtx'].includes(spec.type) ? spec.type : 'files';
      return {name, type: t, path, ...(t === 'files' && spec.format ? {format: spec.format} : {}), ...(t === 'app' && spec.app ? {app: spec.app} : {}),
        ...(spec.host ? {host: spec.host} : {})};
    });
    label = picks.slice(0, 3).map(baseName).join(', ') + (picks.length > 3 ? ` +${picks.length - 3} more` : '');
  } else if (kind === 'units') {
    specs = [{name: spec.name || 'journal', type: 'journald', ...(picks.length ? {units: picks} : {})}];
    label = picks.length ? picks.slice(0, 3).join(', ') + (picks.length > 3 ? ` +${picks.length - 3} more` : '') : (spec.name || 'journal');
  } else if (kind === 'channels') {
    specs = [{...spec, channels: picks}]; label = picks.join(', ');
  } else { specs = [spec]; label = spec.name; }
  const r = await api('/api/scan', {specs, window, use_llm: useLlm, summarize, label});
  if (r.error) return r;
  if (!r.started) return {error: 'a scan is already running; wait for it to finish'};
  view = 'scan';
  $('#main').replaceChildren(el('div', {class: 'empty'}, `Analyzing ${label} … progress is in the console on the left.`));
  pollJob(true);
  return r;
}

async function renderDiscover(m) {
  if (!disc) {
    m.append(el('div', {class: 'empty'}, `searching for logs on ${sys.pretty || 'this machine'}…`));
    disc = 'loading';
    const r = await api('/api/discover');
    disc = r.error ? {error: r.error} : r;
    if (view === 'locations' && locTab === 'discover') renderLocations();
    return;
  }
  if (disc === 'loading') { m.append(el('div', {class: 'empty'}, 'searching…')); return; }
  if (disc.error) { m.append(el('div', {class: 'empty'}, disc.error)); return; }
  m.append(el('div', {class: 'tools'}, el('span', {class: 'lbl'}, `${disc.candidates.length} location(s) found for ${disc.system.os}. Browse one to pick files now, or add it to your sources.`),
    el('span', {style: 'flex:1'}), el('button', {class: 'mini', on: {click: () => { disc = null; renderLocations(); }}}, 'rescan')));
  const cols = 7;
  const t = el('table', {}, el('tr', {}, ...['name', 'type', 'location', 'files', 'size', 'newest', ''].map(h => el('th', {}, h))));
  disc.candidates.forEach((c, i) => {
    const s = c.spec, key = 'disc' + i;
    const noAccess = c.files != null && c.readable === 0 || c.readable_ok === false;
    t.append(el('tr', {class: 'r' + (picker?.key === key ? ' open' : '')},
      el('td', {class: 'title'}, s.name, c.note ? el('div', {class: 'lbl'}, c.note) : null),
      el('td', {}, el('span', {class: 'tag'}, s.type)),
      el('td', {class: 'msg'}, where(s)),
      el('td', {class: 'n', style: noAccess ? 'color:var(--warn)' : ''}, c.files != null ? `${c.readable}/${c.files}` : '—', c.files != null ? el('div', {class: 'lbl'}, 'readable') : null),
      el('td', {class: 'n'}, fmtBytes(c.bytes)), el('td', {class: 'ts'}, c.newest ? ts(c.newest) : '—'),
      el('td', {class: 'act'},
        el('button', {class: 'mini' + (picker?.key === key ? ' on' : ''), on: {click: () => togglePicker(key, s)}}, 'browse / pick'),
        c.configured ? el('span', {class: 'lbl', style: 'margin-left:6px'}, 'added') :
          el('button', {class: 'mini', on: {click: async () => {
            if (await saveSources([...srcs, {...s, name: uniqueName(s.name, srcs.map(x => x.name))}])) { c.configured = true; renderLocations(); } }}}, 'add'))));
    if (picker?.key === key) t.append(el('tr', {class: 'detail'}, el('td', {colspan: cols}, pickerView())));
  });
  m.append(t);
}

function renderAdd(m) {
  if (!form || editIdx !== 'new') { form = {type: (sys.types || []).includes('files') ? 'files' : 'app', name: '', path: ''}; editIdx = 'new'; }
  m.append(el('div', {class: 'pad'}, el('div', {class: 'h'}, el('span', {}, 'open one log file now (not saved)'))));
  const path = el('input', {type: 'text', placeholder: (PATH_HINT[sys.os] || '/path/to/file.log').split('   ').pop(), style: 'max-width:560px'});
  const res = el('div', {class: 'result', style: 'margin-top:6px'});
  const open = async () => {
    if (!path.value.trim()) return;
    const spec = {name: baseName(path.value.trim()), type: 'files', path: path.value.trim()};
    res.className = 'result'; res.textContent = 'reading…';
    const d = await api('/api/browse', {source: spec});
    if (d.error || !d.items?.length) { res.className = 'result bad'; res.textContent = d.error || 'no log files at that path'; return; }
    locTab = 'discover'; disc = disc && disc !== 'loading' ? disc : {system: sys, candidates: []};
    disc.candidates = [{spec, note: 'opened by path', files: d.items.length, readable: d.items.filter(x => x.readable).length,
      bytes: d.items.reduce((n, x) => n + x.bytes, 0), newest: d.items[0]?.mtime}, ...disc.candidates.filter(c => c.note !== 'opened by path')];
    picker = null; await togglePicker('disc0', spec);
  };
  path.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  m.append(el('div', {class: 'form', style: 'padding-top:0'}, el('label', {}, 'file or folder'), path,
    el('div', {class: 'hint'}, 'opens the file picker for that path; nothing is added to your config'),
    el('span', {}), el('div', {class: 'row'}, el('button', {class: 'btn', on: {click: open}}, 'OPEN')), el('span', {}), res));
  m.append(el('div', {class: 'pad', style: 'border-top:1px solid var(--line)'}, el('div', {class: 'h'}, el('span', {}, 'add a log location'))));
  m.append(sourceForm(form, async f => { if (await saveSources([...srcs, f])) { form = null; editIdx = null; locTab = 'configured'; renderLocations(); } },
    () => { form = null; editIdx = null; locTab = 'configured'; renderLocations(); }));
}

$('#scanBtn').addEventListener('click', async () => {
  const sources = [...document.querySelectorAll('#sources input:checked')].map(i => i.value);
  if (!sources.length) { $('#joblog').textContent = 'select at least one source'; return; }
  const r = await api('/api/scan', {sources, window: $('#window').value, use_llm: $('#useLlm').checked, summarize: $('#summarize').checked});
  if (r.started) { view = 'scan'; if (current) render(); }
  if (!r.started) $('#joblog').textContent = r.error || 'a scan is already running';
  pollJob(!!r.started);
});
$('#locBtn').addEventListener('click', () => openLocations());

// open log files from the browser: the picker and drag-and-drop both copy the file into data_dir/uploads, then scan it.
// A folder (or a big pile of files) is uploaded into one batch folder and scanned as one source.
const LOGLIKE = /(\.log([.-]\d+)?|\.log\.\d+\.gz|\.log\.gz|\.out|\.err|\.txt|\.jsonl?|\.evtx|\.xml|\.pf)$|^(messages|syslog|secure|auth|kern|daemon|maillog|mail|cron|dmesg|boot|user|debug|system|install|dpkg|alternatives|faillog)(\.log)?([.-]\d+)?(\.gz)?$/i;
async function openFiles(files, folder) {
  if (folder) {
    const all = files.length;
    files = files.filter(f => LOGLIKE.test(f.name));
    if (!files.length) { $('#joblog').textContent = `${folder}: no log files among its ${all} files`; return; }
  }
  if (!files.length) return;
  const log = $('#joblog'), paths = [], batch = folder || files.length > 20 ?
    [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join('') : '';
  let dir = '';
  for (const [i, f] of files.entries()) {
    log.textContent = `loading ${f.name} (${i + 1}/${files.length}, ${fmtBytes(f.size)})…`;
    let r;
    try {
      r = await (await fetch('/api/upload', {method: 'POST', body: f,
        headers: {'content-type': 'application/octet-stream', 'x-filename': encodeURIComponent(f.name), ...(batch ? {'x-batch': batch} : {})}})).json();
    } catch (e) { r = {error: String(e)}; }
    if (r.error) { log.textContent = `${f.name}: ${r.error}`; return; }
    paths.push(r.path); dir = r.dir;
  }
  const r = batch ? await analyzePicked({type: 'files', name: folder || `${files.length} files`, path: dir}, 'whole', [], 'all', $('#useLlm').checked, $('#summarize').checked)
    : await analyzePicked({type: 'files'}, 'files', paths, 'all', $('#useLlm').checked, $('#summarize').checked);
  if (r?.error) log.textContent = r.error;
}
// a dropped folder arrives as an entry to walk, not as files
async function entryFiles(entry, out) {
  if (entry.isFile) { out.push(await new Promise((ok, no) => entry.file(ok, no))); return out; }
  const reader = entry.createReader();
  for (let batch; (batch = await new Promise((ok, no) => reader.readEntries(ok, no))).length;)
    for (const e of batch) await entryFiles(e, out);
  return out;
}
$('#openBtn').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', e => { openFiles([...e.target.files]); e.target.value = ''; });
$('#folderBtn').addEventListener('click', () => $('#folderIn').click());
$('#folderIn').addEventListener('change', e => {
  const files = [...e.target.files];
  if (files.length) openFiles(files, (files[0].webkitRelativePath || '').split('/')[0] || 'folder');
  e.target.value = '';
});
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (hasFiles(e)) { e.preventDefault(); dragDepth++; document.body.classList.add('dropping'); } });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dropping'); } });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dropping');
  const entries = [...e.dataTransfer.items || []].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  const dirs = entries.filter(x => x.isDirectory);
  if (!dirs.length) { openFiles([...e.dataTransfer.files]); return; }
  (async () => {
    const files = [];
    for (const x of entries) await entryFiles(x, files);
    openFiles(files, dirs.length === 1 && entries.length === 1 ? dirs[0].name : `${entries.length} dropped items`);
  })().catch(err => { $('#joblog').textContent = `could not read the dropped folder: ${err}`; });
});
$('#qBtn').addEventListener('click', () => openQueue());
$('#mBtn').addEventListener('click', () => openModels());
let quitArmed = false;
$('#quitBtn').addEventListener('click', async () => {
  if (!quitArmed) { quitArmed = true; $('#quitBtn').textContent = 'CLICK AGAIN TO QUIT'; setTimeout(() => { quitArmed = false; $('#quitBtn').textContent = 'QUIT'; }, 4000); return; }
  await api('/api/quit', {});
  document.body.replaceChildren(el('div', {class: 'empty', style: 'padding-top:120px'}, 'LogIngestLLM has stopped. You can close this tab.'));
});
$('#refBtn').addEventListener('click', () => { view = 'reference'; history.replaceState(null, '', '#reference'); renderReference(); });
$('#tz').addEventListener('click', () => { utc = !utc; store.set('tz', utc ? 'utc' : 'local'); $('#tz').textContent = utc ? 'UTC' : 'LOCAL'; if (current) render(); loadHistory(); status(); });
$('#theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('theme', t); });

let polling = false;
// Open the finished scan only if this page watched it run (or just started it), so a page load never jumps away.
async function pollJob(started = false) {
  if (polling) return; polling = true;
  let watched = started;
  try {
    for (;;) {
      const j = await api('/api/job');
      if (j.error && !('running' in j)) { $('#joblog').textContent = j.error; break; }
      $('#scanBtn').disabled = j.running;
      $('#scanBtn').textContent = j.running ? 'SCANNING…' : 'RUN SCAN';
      $('#joblog').textContent = (j.log || []).slice(-14).join('\n') + (j.error ? '\nERROR ' + j.error : '') || 'idle';
      $('#joblog').scrollTop = 1e9;
      if (j.running) watched = true;
      if (!j.running) {
        if (watched && j.scan_id && (view !== 'scan' || current?.id !== j.scan_id)) { history.replaceState(null, '', '#' + j.scan_id); await loadHistory(); await openScan(j.scan_id); }
        break;
      }
      await new Promise(r => setTimeout(r, 1000));
    }
  } finally { polling = false; }
}
// pick up scans started by the scheduler
setInterval(async () => { const j = await api('/api/job'); if (j.running) pollJob(); }, 10000);
init();

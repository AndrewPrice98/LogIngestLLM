# Copy to logagent.toml and edit.
data_dir = "data"        # scan history + baseline of "seen before" patterns
window = "24h"           # default look-back for a scan
schedule = "6h"          # automatic scan of enabled sources while the dashboard runs ("" = manual only)
max_findings = 40        # clusters handed to the LLM
min_score = 30           # pre-filter threshold (0-150); lower = more findings

# ---------------------------------------------------------------- your LLM
# Logs never leave your machines unless you point this at a cloud API.
[llm]
provider = "ollama"                     # ollama | openai (any OpenAI-compatible server) | anthropic | none
base_url = "http://localhost:11434"
model = "qwen3:8b"                      # fits an 8 GB GPU; try llama3.1:8b, gemma3:12b-it-qat, etc.
num_ctx = 16384
timeout = 300

# Your own trained model (see README "Training your own model"):
# provider = "openai"
# base_url = "http://127.0.0.1:8081/v1"
# model = "logagent"
# mode = "triage"                          # review each pattern separately (what it was trained on)
# summary_model = "logagent-base"          # whole-log summaries with the adapter off (see README)

# llama.cpp server / LM Studio / vLLM / text-generation-webui:
# provider = "openai"
# base_url = "http://localhost:8080/v1"   # LM Studio: http://localhost:1234/v1
# model = "local-model"
# api_key = ""                            # only if your server wants one

# ---------------------------------------------------------------- sources
# Easiest: manage these from the dashboard (LOG LOCATIONS: discover, add, test, pick files).
# The two below are for Windows; on Linux use type = "journald", on macOS a "files" folder.
[[sources]]
name = "This PC"
type = "windows"
channels = ["System", "Application", "Security"]   # Security needs an admin terminal

[[sources]]
name = "Defender"
type = "windows"
channels = ["Microsoft-Windows-Windows Defender/Operational"]

# Any folder, glob or file; the format is detected per file (syslog, journald JSON, app/JSON lines, .evtx)
# [[sources]]
# name = "var log"
# type = "files"
# path = "/var/log"            # Windows: "C:/ProgramData/MyApp/logs", macOS: "~/Library/Logs"
# format = "auto"              # or force: syslog | journal | app | evtx

# The systemd journal on this machine (Linux)
# [[sources]]
# name = "This machine"
# type = "journald"
# units = ["nginx.service"]    # optional

# Your own app logs (text or JSON lines; tracebacks are grouped)
# [[sources]]
# name = "myapp"
# type = "app"
# path = "D:/Projects/myapp/logs/*.log"

# A syslog file copied from somewhere
# [[sources]]
# name = "nas syslog"
# type = "syslog"
# path = "D:/logs/nas/messages*"


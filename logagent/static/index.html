<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logagent console</title>
<style>
:root{
  --mono:"Cascadia Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0a0d11;--bg2:#0e1217;--panel:#11161c;--panel2:#161c24;--line:#1f2731;--line2:#2a3542;
  --text:#d5dde6;--muted:#7b8898;--dim:#566270;--accent:#36c2dc;--accent2:#1e6f80;
  --crit:#ff4d5e;--high:#ff9f43;--med:#e9cc3f;--low:#6ea8fe;--noise:#5c6773;--ok:#3ddc84;--warn:#ffb547;
  --rowhover:#141b23;--sel:#132530;
}
[data-theme=light]{
  --bg:#eef1f4;--bg2:#e6eaee;--panel:#ffffff;--panel2:#f4f6f8;--line:#d9dfe5;--line2:#c7d0d9;
  --text:#18202a;--muted:#5a6776;--dim:#8592a0;--accent:#0b7f95;--accent2:#b9e2ea;
  --crit:#d2283a;--high:#c96a0c;--med:#9a7f00;--low:#2f6fde;--noise:#7b8794;--ok:#1d8a4e;--warn:#b86e00;
  --rowhover:#f1f5f8;--sel:#e3f2f5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:12.5px/1.45 var(--mono);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
/* ---------- top bar */
.bar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg2);min-height:34px;overflow-x:auto;white-space:nowrap}
.bar>div{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--line);color:var(--muted)}
.bar b{color:var(--text);font-weight:600}
.brand{color:var(--accent)!important;font-weight:700;letter-spacing:.08em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--noise);display:inline-block}
.dot.online{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.offline{background:var(--crit)}.dot.off{background:var(--noise)}
.bar .grow{flex:1;border-right:0}
.bar button{background:none;border:1px solid var(--line2);color:var(--muted);padding:2px 8px;cursor:pointer;border-radius:2px}
.bar button:hover{color:var(--text);border-color:var(--accent)}
/* ---------- layout */
.wrap{display:grid;grid-template-columns:272px 1fr;height:calc(100% - 35px)}
aside{border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto;min-width:0}
main{overflow-y:auto;min-width:0;padding:0 0 40px}
.sec{border-bottom:1px solid var(--line);padding:10px 12px}
.h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
.src{display:grid;grid-template-columns:16px 1fr;gap:6px;padding:3px 0;cursor:pointer;align-items:start}
.src input{margin:2px 0 0;accent-color:var(--accent)}
.src .t{color:var(--dim);font-size:11px;word-break:break-all}
.tag{display:inline-block;font-size:10px;padding:0 4px;border:1px solid var(--line2);color:var(--muted);border-radius:2px;margin-right:4px;text-transform:uppercase}
select,input[type=text],textarea{background:var(--panel);border:1px solid var(--line2);border-radius:2px;padding:5px 7px;width:100%}
select:focus,input:focus,textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.run{width:100%;margin-top:8px;background:var(--accent);color:#031015;border:0;padding:7px;font-weight:700;letter-spacing:.06em;cursor:pointer;border-radius:2px}
.run:disabled{background:var(--line2);color:var(--muted);cursor:default}
.chk{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent)}
pre.console{margin:8px 0 0;max-height:150px;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:6px;font-size:11px;color:var(--muted);white-space:pre-wrap}
.hist a{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 6px;border-left:2px solid transparent;color:var(--text);text-decoration:none}
.hist a:hover{background:var(--rowhover)}
.hist a.active{border-left-color:var(--accent);background:var(--sel)}
.hist .m{color:var(--dim);font-size:11px;grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- scan header */
.head{padding:14px 18px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.headline{font:600 15px/1.35 var(--sans);margin:0 0 4px}
.summary{font:13px/1.5 var(--sans);color:var(--muted);margin:0 0 10px;max-width:110ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--dim);font-size:11.5px}
.meta b{color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));border-bottom:1px solid var(--line)}
.kpi{padding:9px 14px;border-right:1px solid var(--line);background:var(--panel)}
.kpi .v{font-size:19px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kpi.crit .v{color:var(--crit)}.kpi.high .v{color:var(--high)}.kpi.med .v{color:var(--med)}.kpi.low .v{color:var(--low)}
.sevbar{display:flex;height:4px;background:var(--line)}
.sevbar span{display:block;height:100%}
.alert{padding:6px 18px;border-bottom:1px solid var(--line);color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);font-size:11.5px}
/* ---------- tabs + toolbar */
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:2}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs .sp{flex:1}
.tools{display:flex;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tools input[type=text]{width:280px}
.tools select{width:auto}
.chip{border:1px solid var(--line2);background:none;color:var(--muted);padding:2px 8px;border-radius:2px;cursor:pointer;font-size:11px;text-transform:uppercase}
.chip.on{color:#031015;font-weight:700}
.chip.critical.on{background:var(--crit);border-color:var(--crit)}.chip.high.on{background:var(--high);border-color:var(--high)}
.chip.medium.on{background:var(--med);border-color:var(--med)}.chip.low.on{background:var(--low);border-color:var(--low)}
/* ---------- tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:33px;background:var(--bg2);z-index:1;text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap}
th.sorted{color:var(--accent)}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--rowhover)}
tr.r.open td{background:var(--sel)}
td.n{text-align:right;white-space:nowrap}
td.ts{white-space:nowrap;color:var(--muted)}
td.title{font-family:var(--sans);font-size:13px}
td.msg{color:var(--muted);word-break:break-word;font-size:11.5px}
.sev{display:inline-block;width:62px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 0;border-radius:2px;text-transform:uppercase}
.sev.critical{background:var(--crit);color:#fff}.sev.high{background:var(--high);color:#1a0d00}
.sev.medium{background:var(--med);color:#1a1600}.sev.low{background:transparent;color:var(--low);border:1px solid var(--low)}
.sev.noise{color:var(--noise);border:1px solid var(--noise)}
.new{color:var(--accent);font-size:10px;font-weight:700;margin-left:6px}
.lbl{font-size:10.5px;color:var(--dim)}
.lbl.useful{color:var(--ok)}.lbl.noise{color:var(--crit)}
/* ---------- detail */
.detail>td{padding:0;background:var(--panel)!important;cursor:default}
.dgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border-left:2px solid var(--accent)}
.dgrid>div{padding:12px 16px;min-width:0}
.dgrid>div+div{border-left:1px solid var(--line)}
.prose{font:13px/1.55 var(--sans)}
.prose dt{font:10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.prose dt:first-child{margin-top:0}
.prose dd{margin:2px 0 0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:11.5px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){word-break:break-all}
pre.sample{margin:6px 0 0;background:var(--bg);border:1px solid var(--line);padding:7px 8px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;color:var(--text)}
.fb{display:flex;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2);flex-wrap:wrap}
.fb .k{color:var(--dim);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
.fb button{background:none;border:1px solid var(--line2);color:var(--muted);padding:3px 9px;cursor:pointer;border-radius:2px;font-size:11.5px}
.fb button:hover{border-color:var(--accent);color:var(--text)}
.fb button.on.useful{background:var(--ok);border-color:var(--ok);color:#03140a}
.fb button.on.noise{background:var(--crit);border-color:var(--crit);color:#fff}
.fb select{width:auto;padding:2px 6px;font-size:11.5px}
.empty{padding:40px 18px;color:var(--dim);text-align:center}
.pad{padding:12px 18px}
.answer{white-space:pre-wrap;font:13px/1.55 var(--sans);margin-top:10px;max-width:110ch}
.btn{background:var(--accent);color:#031015;border:0;padding:6px 14px;font-weight:700;border-radius:2px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5}
td.title{min-width:200px}
/* ---------- log locations */
.mini{background:none;border:1px solid var(--line2);color:var(--muted);padding:0 6px;cursor:pointer;border-radius:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.mini:hover{color:var(--text);border-color:var(--accent)}
.mini.on{color:var(--accent);border-color:var(--accent)}
.mini.danger:hover{color:var(--crit);border-color:var(--crit)}
td.act{white-space:nowrap;text-align:right}
td.act .mini{margin-left:4px}
.form{display:grid;grid-template-columns:120px minmax(0,560px);gap:6px 12px;align-items:center;padding:12px 18px}
.form label{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.form .hint{grid-column:2;color:var(--dim);font-size:11px;margin-top:-3px}
.form .row{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.sec{background:none;border:1px solid var(--line2);color:var(--muted)}
.result{font-size:11.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.result.ok{color:var(--ok)}.result.bad{color:var(--crit)}
.picker{border-left:2px solid var(--accent);background:var(--panel)}
.picker .tools{border-bottom:1px solid var(--line)}
.picker table th{top:0}
tr.dis td{color:var(--dim)}
.sumbox{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
.sumbox pre{margin:6px 0 0;white-space:pre-wrap;font:13px/1.55 var(--sans);max-width:120ch}
@media (max-width:1250px){.hide-sm{display:none}}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}.dgrid{grid-template-columns:1fr}.dgrid>div+div{border-left:0;border-top:1px solid var(--line)}.hide-sm{display:none}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="brand">LOGAGENT</div>
  <div>model <span class="dot" id="mDot"></span><b id="mName">…</b><span id="mDetail"></span></div>
  <div>privilege <b id="adm">…</b></div>
  <div>schedule <b id="sch">…</b></div>
  <div class="grow"></div>
  <div><button id="tz" title="Toggle UTC / local time">UTC</button><button id="theme" title="Toggle theme">◐</button></div>
</div>
<div class="wrap">
  <aside>
    <div class="sec">
      <div class="h"><span>Sources <span id="srcCount"></span></span><button class="mini" id="locBtn" title="Add, edit, discover, and pick individual log files">log locations</button></div>
      <div id="sources"></div>
    </div>
    <div class="sec">
      <div class="h"><span>Window</span></div>
      <select id="window" aria-label="Time window">
        <option value="1h">1h</option><option value="6h">6h</option><option value="24h" selected>24h</option>
        <option value="3d">3d</option><option value="7d">7d</option><option value="30d">30d</option><option value="all">all</option>
      </select>
      <label class="chk"><input type="checkbox" id="useLlm" checked> model review</label>
      <label class="chk" title="Also write a summary of everything collected, aware of the OS it came from"><input type="checkbox" id="summarize"> summarize whole log</label>
      <button class="run" id="scanBtn">RUN SCAN</button>
      <pre class="console" id="joblog">idle</pre>
    </div>
    <div class="sec hist">
      <div class="h"><span>History</span><span id="histCount"></span></div>
      <div id="history"><div class="empty">no scans</div></div>
    </div>
  </aside>
  <main id="main"><div class="empty">Select sources and run a scan.</div></main>
</div>
<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'on') for (const [e, f] of Object.entries(v)) n.addEventListener(e, f);
    else if (k === 'checked' || k === 'selected' || k === 'disabled') n[k] = !!v;
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
};
const api = async (path, body) => {
  try {
    const r = await fetch(path, body ? {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)} : {});
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
    return j;
  } catch (e) { return {error: 'dashboard server unreachable'}; }
};
const store = {get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};

// ---------- time formatting (precise, sortable)
let utc = store.get('tz', 'utc') === 'utc';
const pad = n => String(n).padStart(2, '0');
function ts(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso || '—';
  if (utc) return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}Z`;
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function rate(f) {
  if (f.count < 2) return '—';
  const span = (new Date(f.last) - new Date(f.first)) / 1000;
  if (span <= 0) return `${f.count}/<1s`;
  const ph = f.count / span * 3600;
  return ph >= 60 ? `${(ph / 60).toFixed(1)}/min` : ph >= 1 ? `${ph.toFixed(1)}/h` : `${(ph * 24).toFixed(1)}/d`;
}
function span(f) {
  const s = (new Date(f.last) - new Date(f.first)) / 1000;
  if (!(s > 0)) return '0s';
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = Math.floor(s % 60);
  return [d && d + 'd', h && h + 'h', m && m + 'm', !d && x && x + 's'].filter(Boolean).join(' ');
}
const LV = ['critical', 'high', 'medium', 'low', 'noise'];
const impOf = s => s >= 100 ? 'critical' : s >= 75 ? 'high' : s >= 50 ? 'medium' : 'low';

// ---------- state
let current = null, fb = {}, tab = store.get('tab', 'findings'), openKey = null;
let sys = {}, view = 'scan', locTab = 'configured', srcs = [], cfgPath = null;
let q = '', hostF = '', levels = new Set(LV.slice(0, 4)), sortBy = {k: 'imp', d: 1}, showAll = false;

async function init() {
  document.documentElement.dataset.theme = store.get('theme', 'dark');
  $('#tz').textContent = utc ? 'UTC' : 'LOCAL';
  sys = await api('/api/system');
  if (sys.error) sys = {};
  const cfg = await api('/api/config');
  if (cfg.error) { $('#main').replaceChildren(el('div', {class: 'empty'}, cfg.error)); return; }
  if (cfg.window) $('#window').value = cfg.window;
  renderSourceList(cfg);
  const full = await api('/api/sources'); srcs = full.sources || []; cfgPath = full.config_path;
  await status();
  setInterval(status, 15000);
  await loadHistory(true);
  pollJob();
}

function renderSourceList(cfg) {
  const box = $('#sources'); box.replaceChildren();
  if (!cfg.sources.length) box.append(el('div', {class: 'lbl'}, 'no sources yet: open ', el('a', {href: '#', on: {click: e => { e.preventDefault(); openLocations(); }}}, 'log locations')));
  for (const s of cfg.sources) box.append(el('label', {class: 'src'},
    el('input', {type: 'checkbox', value: s.name, checked: s.enabled}),
    el('span', {}, el('span', {class: 'tag'}, s.type), s.name, el('div', {class: 't'}, s.detail || ''))));
  $('#srcCount').textContent = cfg.sources.length ? `[${cfg.sources.length}]` : '';
}

async function refreshSources() {
  const cfg = await api('/api/config');
  if (!cfg.error) renderSourceList(cfg);
  const full = await api('/api/sources');
  if (!full.error) { srcs = full.sources || []; cfgPath = full.config_path; }
}

async function status() {
  const s = await api('/api/status');
  if (s.error) { $('#mDot').className = 'dot offline'; $('#mName').textContent = 'dashboard offline'; return; }
  const m = s.model || {};
  $('#mDot').className = 'dot ' + m.state;
  $('#mName').textContent = s.llm.provider === 'none' ? 'disabled' : `${s.llm.model || s.llm.provider}`;
  $('#mDetail').textContent = m.state === 'online' ? ` ${m.latency_ms}ms` + (s.llm.mode ? ` · ${s.llm.mode}` : '') : m.state === 'offline' ? ' OFFLINE → rules only' : '';
  $('#mDetail').title = m.detail || '';
  $('#adm').textContent = s.admin ? (sys.os === 'Windows' ? 'admin' : 'root') : sys.os === 'Windows' ? 'user (Security log skipped)' : sys.journal_system === false ? 'user (system journal not readable)' : 'user';
  $('#adm').style.color = s.admin || sys.os !== 'Windows' && sys.journal_system !== false ? 'var(--ok)' : 'var(--warn)';
  $('#sch').textContent = s.schedule?.every ? `every ${s.schedule.every} · next ${s.schedule.next ? ts(s.schedule.next) : '—'}` : 'manual';
  if (s.llm.provider === 'none' || m.state === 'offline') $('#useLlm').checked = false;
}

const histItem = s => el('a', {href: '#' + s.id, class: view === 'scan' && current?.id === s.id ? 'active' : '',
  on: {click: e => { e.preventDefault(); openScan(s.id); }}},
  el('span', {}, ts(s.created)), el('span', {class: 'lbl'}, `${s.flagged}⚑ ${s.events}ev`),
  el('span', {class: 'm'}, (s.label ? '⎘ ' + s.label + ' · ' : '') + (s.headline || '')));

async function loadHistory(openLatest) {
  const scans = await api('/api/scans');
  const h = $('#history'); h.replaceChildren();
  $('#histCount').textContent = scans.length || '';
  if (!scans.length) h.append(el('div', {class: 'empty'}, 'no scans'));
  for (const s of scans) h.append(histItem(s));
  if (location.hash === '#locations') { if (view !== 'locations') openLocations(); return; }
  if (!scans.length) return;
  const want = location.hash.slice(1) || (openLatest && scans[0].id);
  if (want && (!current || current.id !== want)) await openScan(want);
}

async function openScan(id) {
  const s = await api('/api/scans/' + encodeURIComponent(id));
  if (s.error) return;
  fb = await api('/api/feedback/' + encodeURIComponent(id));
  if (fb.error) fb = {};
  current = s; openKey = null; view = 'scan'; showAll = !!s.label;
  history.replaceState(null, '', '#' + id);
  document.querySelectorAll('.hist a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
  render();
}

// Merge the model/rules verdicts with the raw cluster metadata, one row per finding.
function rows() {
  const s = current, a = s.analysis || {};
  const byKey = Object.fromEntries([...(s.findings || []), ...(s.others || [])].map(f => [f.key, f]));
  const out = [];
  const used = new Set();
  for (const f of a.findings || []) {
    const raws = (f.keys || []).map(k => byKey[k]).filter(Boolean);
    if (!raws.length) continue;
    raws.forEach(r => used.add(r.key));
    const p = raws[0];
    out.push({imp: (f.importance || 'low').toLowerCase(), title: f.title, why: f.why, action: f.action, what: f.what, related: f.related,
      host: f.host || p.host, source: p.source, program: p.program, event_id: p.event_id, raws, keys: raws.map(r => r.key),

        program: p.program, event_id: p.event_id, raws: [p], keys: [k], count: p.count, first: p.first, last: p.last, score: p.score, novel: p.novel}); }
  }

    ...['auto', 'syslog', 'journal', 'app', 'evtx'].map(o => el('option', {value: o, selected: (f.format || 'auto') === o}, o))));
  if (f.type === 'app') fields.push(el('label', {}, 'app name'), bind('app', {placeholder: 'optional, defaults to the file name'}));
  if (f.type === 'windows') fields.push(el('label', {}, 'channels'), bind('channels', {placeholder: 'System, Application, Security'}));
  if (f.type === 'journald') fields.push(el('label', {}, 'units'), bind('units', {placeholder: 'optional: nginx.service, sshd.service (empty = whole journal)'}));
  if (f.type === 'ssh') fields.push(
    el('label', {}, 'host'), bind('host', {placeholder: 'pi@raspberrypi.local'}),
    el('div', {class: 'hint'}, 'key login first: ssh-copy-id ' + (f.host || 'pi@raspberrypi.local')),
    el('label', {}, 'device'), el('select', {on: {change: e => { f.device = e.target.value; }}},
      ...['linux', 'pi', 'jetson'].map(o => el('option', {value: o, selected: (f.device || 'linux') === o}, o))),
    el('label', {}, 'port'), bind('port', {placeholder: '22'}),
    el('label', {}, 'identity'), bind('identity', {placeholder: 'optional: ~/.ssh/id_ed25519'}),
    el('label', {}, 'remote logs'), bind('logs', {placeholder: 'optional: /home/pi/myapp/*.log, /var/log/nginx/error.log'}));
  fields.push(el('label', {}, 'enabled'), el('label', {class: 'chk', style: 'margin:0'}, el('input', {type: 'checkbox', checked: f.enabled !== false,
    on: {change: e => { f.enabled = e.target.checked; }}}), 'include in RUN SCAN and scheduled scans'));
  fields.push(el('span', {}), el('div', {class: 'row'},
    el('button', {class: 'btn', on: {click: () => { const c = {...f}; if (c.enabled !== false) delete c.enabled; onSave(c); }}}, 'SAVE'),
    el('button', {class: 'btn sec', on: {click: async () => { res.className = 'result'; res.textContent = 'testing…';
      const r = await api('/api/sources/test', {source: f}); const ok = r.ok;
      res.className = 'result ' + (ok ? 'ok' : 'bad'); res.textContent = ok ? testLine(r) + (r.sample ? '\nnewest: ' + r.sample : '') : 'failed: ' + r.error; }}}, 'TEST'),
    el('button', {class: 'btn sec', on: {click: onCancel}}, 'CANCEL')), el('span', {}), res);
  return el('div', {class: 'form', on: {click: e => e.stopPropagation()}}, ...fields);
}

async function togglePicker(key, spec) {
  if (picker?.key === key) { picker = null; renderLocations(); return; }
  editIdx = null;
  picker = {key, spec, data: null, filter: '', picked: new Set(), msg: ''};
  renderLocations();
  const d = await api('/api/browse', {source: spec});
  if (picker?.key !== key) return;
  picker.data = d.error ? {kind: 'error', items: [], hint: d.error} : d;
  if (picker.data.kind === 'files') { // preselect the newest readable file
    const first = picker.data.items.find(x => x.readable && x.bytes > 0 && x.format !== 'binary');
    if (first) picker.picked.add(first.path);
  }
  renderLocations();
}

function pickerView() {
  const p = picker, d = p.data;
  if (!d) return el('div', {class: 'pad picker'}, 'reading location…');
  const win = el('select', {'aria-label': 'window', style: 'width:auto'}, ...['all', '30d', '7d', '24h', '6h', '1h'].map(w => el('option', {value: w}, w === 'all' ? 'whole file (all time)' : 'last ' + w)));
  if (d.kind === 'units' || d.kind === 'channels' || d.kind === 'whole') win.value = $('#window').value;
  const useLlm = el('input', {type: 'checkbox', checked: $('#useLlm').checked});
  const sum = el('input', {type: 'checkbox', checked: true});
  const count = el('span', {class: 'lbl'});
  const go = el('button', {class: 'btn', style: 'margin:0'});
  const msg = el('div', {class: 'result', style: 'padding:0 18px 8px'}, p.msg || '');
  const body = el('tbody');
  const itemKey = x => x.path || x.unit || x.channel;
  const update = () => {
    const n = p.picked.size;
    count.textContent = d.kind === 'whole' ? '' : `${n} selected of ${d.items.length}`;
    go.textContent = d.kind === 'files' ? `ANALYZE ${n || ''} FILE${n === 1 ? '' : 'S'}` : d.kind === 'units' ? (n ? `ANALYZE ${n} UNIT${n === 1 ? '' : 'S'}` : 'ANALYZE ENTIRE JOURNAL') :
      d.kind === 'channels' ? `ANALYZE ${n} CHANNEL${n === 1 ? '' : 'S'}` : 'ANALYZE';
    go.disabled = (d.kind === 'files' || d.kind === 'channels') && !n || d.kind === 'error';
  };
  const drawRows = () => {
    body.replaceChildren();
    const fl = p.filter.toLowerCase();
    const items = d.items.filter(x => !fl || itemKey(x).toLowerCase().includes(fl));
    for (const x of items.slice(0, 400)) {
      const k = itemKey(x), ok = d.kind !== 'files' || (x.readable && x.format !== 'binary');
      const cb = el('input', {type: 'checkbox', checked: p.picked.has(k), disabled: !ok,
        on: {change: e => { e.target.checked ? p.picked.add(k) : p.picked.delete(k); update(); }}});
      const cells = d.kind === 'files'
        ? [el('td', {class: 'msg', style: 'color:var(--text)'}, x.name), el('td', {}, el('span', {class: 'tag'}, x.format)),
           el('td', {class: 'n'}, fmtBytes(x.bytes)), el('td', {class: 'ts'}, ts(x.mtime)),
           el('td', {class: 'lbl', style: ok ? '' : 'color:var(--warn)'}, !x.readable ? 'no access' : x.format === 'binary' ? 'binary' : 'ok')]
        : [el('td', {class: 'msg', style: 'color:var(--text)'}, k)];
      body.append(el('tr', {class: 'r' + (ok ? '' : ' dis'), on: {click: e => { if (e.target !== cb && ok) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); } }}},
        el('td', {style: 'width:24px'}, cb), ...cells));
    }
    if (items.length > 400) body.append(el('tr', {}, el('td', {colspan: 6, class: 'lbl'}, `${items.length - 400} more; narrow the filter`)));
  };
  go.addEventListener('click', async () => {
    const r = await analyzePicked(p.spec, d.kind, [...p.picked], win.value, useLlm.checked, sum.checked);
    if (r.error) { p.msg = '⚠ ' + r.error; msg.textContent = p.msg; msg.className = 'result bad'; }
  });
  const wrap = el('div', {class: 'picker', on: {click: e => e.stopPropagation()}});
  if (d.hint) wrap.append(el('div', {class: 'alert'}, 'ⓘ ' + d.hint));
  const tools = el('div', {class: 'tools'});
  if (d.kind !== 'whole' && d.kind !== 'error') tools.append(
    el('input', {type: 'text', placeholder: 'filter', value: p.filter, style: 'width:200px', on: {input: e => { p.filter = e.target.value; drawRows(); }}}),
    el('button', {class: 'mini', on: {click: () => { const fl = p.filter.toLowerCase();
      for (const x of d.items) if ((d.kind !== 'files' || (x.readable && x.format !== 'binary')) && (!fl || itemKey(x).toLowerCase().includes(fl))) p.picked.add(itemKey(x));
      drawRows(); update(); }}}, 'select all'),
    el('button', {class: 'mini', on: {click: () => { p.picked.clear(); drawRows(); update(); }}}, 'none'), count);
  tools.append(el('span', {style: 'flex:1'}), win,
    el('label', {class: 'chk', style: 'margin:0'}, useLlm, 'model review'),
    el('label', {class: 'chk', style: 'margin:0', title: 'model writes an OS-aware summary of everything picked'}, sum, 'summarize'), go);
  wrap.append(tools, msg);
  if (d.kind === 'files' || d.kind === 'units' || d.kind === 'channels') {
    const head = d.kind === 'files' ? ['', 'file', 'format', 'size', 'modified', 'access'] : ['', d.kind === 'units' ? 'systemd unit' : 'channel'];
    wrap.append(el('table', {}, el('thead', {}, el('tr', {}, ...head.map(h => el('th', {}, h)))), body));
    if (!d.items.length) wrap.append(el('div', {class: 'empty'}, d.kind === 'files' ? 'no log files at this location' : 'nothing listed'));
  }
  drawRows(); update();
  return wrap;
}

async function analyzePicked(spec, kind, picks, window, useLlm, summarize) {
  let specs, label;
  if (kind === 'files') {
    const taken = [];
    specs = picks.map(path => {
      const name = uniqueName(baseName(path), taken); taken.push(name);
      const t = ['syslog', 'app', 'evtx'].includes(spec.type) ? spec.type : 'files';
      return {name, type: t, path, ...(t === 'files' && spec.format ? {format: spec.format} : {}), ...(t === 'app' && spec.app ? {app: spec.app} : {})};
    });
    label = picks.slice(0, 3).map(baseName).join(', ') + (picks.length > 3 ? ` +${picks.length - 3} more` : '');
  } else if (kind === 'units') {
    specs = [{name: spec.name || 'journal', type: 'journald', ...(picks.length ? {units: picks} : {})}];
    label = picks.length ? picks.slice(0, 3).join(', ') + (picks.length > 3 ? ` +${picks.length - 3} more` : '') : (spec.name || 'journal');
  } else if (kind === 'channels') {
    specs = [{...spec, channels: picks}]; label = picks.join(', ');
  } else { specs = [spec]; label = spec.name; }
  const r = await api('/api/scan', {specs, window, use_llm: useLlm, summarize, label});
  if (r.error) return r;
  if (!r.started) return {error: 'a scan is already running; wait for it to finish'};
  view = 'scan';
  $('#main').replaceChildren(el('div', {class: 'empty'}, `Analyzing ${label} … progress is in the console on the left.`));
  pollJob(true);
  return r;
}

async function renderDiscover(m) {
  if (!disc) {
    m.append(el('div', {class: 'empty'}, `searching for logs on ${sys.pretty || 'this machine'}…`));
    disc = 'loading';
    const r = await api('/api/discover');
    disc = r.error ? {error: r.error} : r;
    if (view === 'locations' && locTab === 'discover') renderLocations();
    return;
  }
  if (disc === 'loading') { m.append(el('div', {class: 'empty'}, 'searching…')); return; }
  if (disc.error) { m.append(el('div', {class: 'empty'}, disc.error)); return; }
  m.append(el('div', {class: 'tools'}, el('span', {class: 'lbl'}, `${disc.candidates.length} location(s) found for ${disc.system.os}. Browse one to pick files now, or add it to your sources.`),
    el('span', {style: 'flex:1'}), el('button', {class: 'mini', on: {click: () => { disc = null; renderLocations(); }}}, 'rescan')));
  const cols = 7;
  const t = el('table', {}, el('tr', {}, ...['name', 'type', 'location', 'files', 'size', 'newest', ''].map(h => el('th', {}, h))));
  disc.candidates.forEach((c, i) => {
    const s = c.spec, key = 'disc' + i;
    const noAccess = c.files != null && c.readable === 0 || c.readable_ok === false;
    t.append(el('tr', {class: 'r' + (picker?.key === key ? ' open' : '')},
      el('td', {class: 'title'}, s.name, c.note ? el('div', {class: 'lbl'}, c.note) : null),
      el('td', {}, el('span', {class: 'tag'}, s.type), s.device ? el('span', {class: 'tag'}, s.device) : null),
      el('td', {class: 'msg'}, where(s)),
      el('td', {class: 'n', style: noAccess ? 'color:var(--warn)' : ''}, c.files != null ? `${c.readable}/${c.files}` : '—', c.files != null ? el('div', {class: 'lbl'}, 'readable') : null),
      el('td', {class: 'n'}, fmtBytes(c.bytes)), el('td', {class: 'ts'}, c.newest ? ts(c.newest) : '—'),
      el('td', {class: 'act'},
        el('button', {class: 'mini' + (picker?.key === key ? ' on' : ''), on: {click: () => togglePicker(key, s)}}, 'browse / pick'),
        c.configured ? el('span', {class: 'lbl', style: 'margin-left:6px'}, 'added') :
          el('button', {class: 'mini', on: {click: async () => {
            if (await saveSources([...srcs, {...s, name: uniqueName(s.name, srcs.map(x => x.name))}])) { c.configured = true; renderLocations(); } }}}, 'add'))));
    if (picker?.key === key) t.append(el('tr', {class: 'detail'}, el('td', {colspan: cols}, pickerView())));
  });
  m.append(t);
}

function renderAdd(m) {
  if (!form || editIdx !== 'new') { form = {type: (sys.types || []).includes('files') ? 'files' : 'app', name: '', path: ''}; editIdx = 'new'; }
  m.append(el('div', {class: 'pad'}, el('div', {class: 'h'}, el('span', {}, 'open one log file now (not saved)'))));
  const path = el('input', {type: 'text', placeholder: (PATH_HINT[sys.os] || '/path/to/file.log').split('   ').pop(), style: 'max-width:560px'});
  const res = el('div', {class: 'result', style: 'margin-top:6px'});
  const open = async () => {
    if (!path.value.trim()) return;
    const spec = {name: baseName(path.value.trim()), type: 'files', path: path.value.trim()};
    res.className = 'result'; res.textContent = 'reading…';
    const d = await api('/api/browse', {source: spec});
    if (d.error || !d.items?.length) { res.className = 'result bad'; res.textContent = d.error || 'no log files at that path'; return; }
    locTab = 'discover'; disc = disc && disc !== 'loading' ? disc : {system: sys, candidates: []};
    disc.candidates = [{spec, note: 'opened by path', files: d.items.length, readable: d.items.filter(x => x.readable).length,
      bytes: d.items.reduce((n, x) => n + x.bytes, 0), newest: d.items[0]?.mtime}, ...disc.candidates.filter(c => c.note !== 'opened by path')];
    picker = null; await togglePicker('disc0', spec);
  };
  path.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  m.append(el('div', {class: 'form', style: 'padding-top:0'}, el('label', {}, 'file or folder'), path,
    el('div', {class: 'hint'}, 'opens the file picker for that path; nothing is added to your config'),
    el('span', {}), el('div', {class: 'row'}, el('button', {class: 'btn', on: {click: open}}, 'OPEN')), el('span', {}), res));
  m.append(el('div', {class: 'pad', style: 'border-top:1px solid var(--line)'}, el('div', {class: 'h'}, el('span', {}, 'add a log location'))));
  m.append(sourceForm(form, async f => { if (await saveSources([...srcs, f])) { form = null; editIdx = null; locTab = 'configured'; renderLocations(); } },
    () => { form = null; editIdx = null; locTab = 'configured'; renderLocations(); }));
}

$('#scanBtn').addEventListener('click', async () => {
  const sources = [...document.querySelectorAll('#sources input:checked')].map(i => i.value);
  if (!sources.length) { $('#joblog').textContent = 'select at least one source'; return; }
  const r = await api('/api/scan', {sources, window: $('#window').value, use_llm: $('#useLlm').checked, summarize: $('#summarize').checked});
  if (r.started) { view = 'scan'; if (current) render(); }
  if (!r.started) $('#joblog').textContent = r.error || 'a scan is already running';
  pollJob(!!r.started);
});
$('#locBtn').addEventListener('click', () => openLocations());
$('#tz').addEventListener('click', () => { utc = !utc; store.set('tz', utc ? 'utc' : 'local'); $('#tz').textContent = utc ? 'UTC' : 'LOCAL'; if (current) render(); loadHistory(); status(); });
$('#theme').addEventListener('click', () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('theme', t); });

let polling = false;
// Open the finished scan only if this page watched it run (or just started it), so a page load never jumps away.
async function pollJob(started = false) {
  if (polling) return; polling = true;
  let watched = started;
  try {
    for (;;) {
      const j = await api('/api/job');
      if (j.error && !('running' in j)) { $('#joblog').textContent = j.error; break; }
      $('#scanBtn').disabled = j.running;
      $('#scanBtn').textContent = j.running ? 'SCANNING…' : 'RUN SCAN';
      $('#joblog').textContent = (j.log || []).slice(-14).join('\n') + (j.error ? '\nERROR ' + j.error : '') || 'idle';
      $('#joblog').scrollTop = 1e9;
      if (j.running) watched = true;
      if (!j.running) {
        if (watched && j.scan_id && (view !== 'scan' || current?.id !== j.scan_id)) { history.replaceState(null, '', '#' + j.scan_id); await loadHistory(); await openScan(j.scan_id); }
        break;
      }
      await new Promise(r => setTimeout(r, 1000));
    }
  } finally { polling = false; }
}
// pick up scans started by the scheduler
setInterval(async () => { const j = await api('/api/job'); if (j.running) pollJob(); }, 10000);
init();
</script>

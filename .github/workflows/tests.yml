name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner (the app itself is standard library only)
        run: python -m pip install pytest
      - name: Unit tests and known-answer scenarios
        run: python -m pytest -q -rs
      - name: Known-answer report (rules, tools, indicators, ATT&CK, false-alarm guards)
        run: python -m logagent eval
